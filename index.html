*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial;line-height:1.65}
header{background:var(--navy);color:white;padding:16px;position:sticky;top:0;z-index:30}.wrap{max-width:980px;margin:auto;padding:16px}.brand{font-size:24px;font-weight:900}.sub{font-size:12px;opacity:.75}

button,input,textarea,select{font:inherit}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 10px;background:#fff}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#e9edf3}.danger{background:#b42318;color:#fff}.choice{border:0;border-radius:18px;padding:20px;text-align:right;min-height:112px;cursor:pointer;font-weight:800}.f{background:var(--blue)}.t{background:var(--green)}
.muted{color:var(--muted)}.pill{display:inline-block;background:#eef2f6;border-radius:99px;padding:4px 9px;font-size:12px}.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}.progress i{display:block;height:100%;background:var(--navy)}.stat{font-size:30px;font-weight:900}.row{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.read{padding:14px;border-radius:14px;margin:9px 0}.why{background:var(--yellow)}.how{background:var(--blue)}.remember{background:var(--green)}.mistake{background:var(--red)}
.option{display:block;width:100%;text-align:right;padding:12px;margin:7px 0;border:1px solid #d0d5dd;border-radius:11px;background:#fff}.sel{border-color:var(--accent);background:#eef5ff}.correct{border-color:#16a34a;background:#effaf2}.wrong{border-color:#dc2626;background:#fff1f1}

.noteDock{position:sticky;bottom:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 8px 24px #0002;z-index:20}.keypad{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.keypad button{border:1px solid #d0d5dd;background:#f8fafc;border-radius:9px;padding:8px 12px;font-weight:800}.login{max-width:560px;margin:28px auto}.statusOpen{color:#b54708}.statusClosed{color:#067647}.tiny{font-size:12px}.sectionTitle{margin:20px 0 6px}.lessonCount{font-size:13px;color:var(--muted)}

<script>
(function(){

const app=document.getElementById("app"),$=id=>document.getElementById(id),KEY="nitro_final_v1";

if(!db)db={user:null,users:[
{id:"owner",name:"المالك",email:"owner@nitro.local",role:"owner",access:"all",code:"OWNER-001",active:true,permissions:{all:true}},
{id:"demo",name:"طالب تجريبي",email:"student@nitro.local",role:"student",access:"all",code:"STU-001",active:true,permissions:{}}
],plan:{days:90},progress:{},notes:{},tickets:[],attempts:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));

const lessons=[
{id:"ops",type:"q",title:"العمليات على الأعداد",idea:"نجمع أو نطرح أو نضرب الأعداد مع ترتيب المنازل تحت بعضها.",rule:"في الجمع والطرح: الآحاد تحت الآحاد، والعشرات تحت العشرات، والمئات تحت المئات.",board:"   50\n+ 100\n─────\n  150",steps:["رتّب الأعداد تحت بعض حسب المنزلة.","ابدأ من جهة الآحاد.","أكمل منزلة منزلة حتى تصل للناتج."],qs:[["50 + 100 = ؟",["100","150","200","250"],1,"   50\n+ 100\n─────\n  150"],["325 + 75 = ؟",["350","375","400","425"],2,"  325\n+  75\n─────\n  400"],["500 - 125 = ؟",["325","350","375","400"],2,"  500\n- 125\n─────\n  375"]]},
{id:"divisibility",type:"q",title:"قابلية القسمة",idea:"نعرف بسرعة هل العدد يقبل القسمة على عدد آخر دون إجراء قسمة طويلة.",rule:"على 2 إذا كان الآحاد زوجيًا، وعلى 5 إذا انتهى بـ0 أو5، وعلى 10 إذا انتهى بـ0، وعلى 3 إذا كان مجموع أرقامه يقبل القسمة على3.",formula:"مثال: 123 → 1+2+3=6، إذن يقبل القسمة على 3.",steps:["حدد المقسوم عليه.","طبّق قاعدة القسمة الخاصة به.","تحقق من آخر رقم أو مجموع الأرقام حسب القاعدة."],qs:[["أي عدد يقبل القسمة على 5؟",["42","63","75","88"],2,"75 ينتهي بـ5، لذلك يقبل القسمة على 5."],["هل 246 يقبل القسمة على 2؟",["نعم","لا"],0,"246 ينتهي بـ6 وهو عدد زوجي."],["هل 123 يقبل القسمة على 3؟",["نعم","لا"],0,"1+2+3=6، و6 يقبل القسمة على3."]]},
{id:"fractions",type:"q",title:"الكسور",idea:"الكسر يتكوّن من بسط فوق ومقام تحت، ويمثل جزءًا من كل.",rule:"عند جمع كسرين لهما المقام نفسه نجمع البسطين ونبقي المقام.",formula:"1/5 + 2/5 = 3/5",steps:["افحص المقامات.","إذا كانت متساوية اجمع البسطين فقط.","بسّط الناتج إذا أمكن."],qs:[["1/4 + 2/4 = ؟",["3/4","3/8","1/2","2/4"],0,"المقامات متساوية: 1+2=3 والمقام يبقى4."],["نصف 20؟",["5","10","15","20"],1,"1/2 × 20 = 10."],["أي كسر يساوي النصف؟",["2/3","3/6","4/5","5/8"],1,"3/6 تبسط إلى1/2."]]},
{id:"decimals",type:"q",title:"الأعداد العشرية",idea:"الفاصلة العشرية تفصل الجزء الصحيح عن الأجزاء من عشرة ومئة وألف.",rule:"في الجمع والطرح نضع الفواصل تحت بعضها.",board:"  2.50\n+ 1.25\n──────\n  3.75",steps:["رتّب الفواصل تحت بعضها.","أكمل المنازل الناقصة بصفر عند الحاجة.","اجمع أو اطرح كالأعداد الصحيحة."],qs:[["2.5 + 1.25 = ؟",["2.75","3.25","3.75","4.25"],2,"  2.50\n+ 1.25\n──────\n  3.75"],["0.5 يساوي؟",["1/4","1/2","3/4","2"],1,"0.5 = 5/10 = 1/2."],["1.20 - 0.20 = ؟",["0.8","1","1.2","1.4"],1," 1.20\n-0.20\n─────\n 1.00"]]},
{id:"powers",type:"q",title:"الأسس",idea:"الأس يعني تكرار ضرب العدد في نفسه.",rule:"a² = a×a ، و a³ = a×a×a.",formula:"5² = 5 × 5 = 25",steps:["حدد الأساس.","حدد قيمة الأس.","كرر ضرب الأساس في نفسه بعدد مرات الأس."],qs:[["4² = ؟",["8","12","16","20"],2,"4²=4×4=16."],["2³ = ؟",["4","6","8","10"],2,"2³=2×2×2=8."],["10² = ؟",["20","50","100","1000"],2,"10×10=100."]]},
{id:"roots",type:"q",title:"العمليات على الجذور",idea:"الجذر التربيعي لعدد هو العدد الذي إذا ضربناه في نفسه أعطى العدد الأصلي.",rule:"√64 = 8 لأن 8×8=64.",formula:"√64 = 8",steps:["ابحث عن مربع كامل قريب أو مباشر.","اسأل: ما العدد الذي مربعه يساوي العدد تحت الجذر؟","اكتب الناتج."],qs:[["√81 = ؟",["7","8","9","10"],2,"9×9=81، إذن √81=9."],["√49 = ؟",["5","6","7","8"],2,"7×7=49."],["√100 = ؟",["5","10","20","50"],1,"10×10=100."]]},
{id:"diffSquares",type:"q",title:"الفرق بين مربعين",idea:"صيغة مختصرة لتفكيك فرق مربعين.",rule:"a² - b² = (a-b)(a+b)",formula:"25 - 9 = 5² - 3² = (5-3)(5+3)=16",steps:["تأكد أن الحدين مربعان كاملان.","خذ الجذر لكل حد.","اكتب حاصل ضرب الفرق في المجموع."],qs:[["x²-9 = ؟",["(x-3)(x+3)","(x-9)(x+1)","(x-3)²","x(x-9)"],0,"9=3²، إذن x²-3²=(x-3)(x+3)."],["49-25 = ؟",["12","24","36","48"],1,"7²-5²=(7-5)(7+5)=2×12=24."],["100-64 = ؟",["24","32","36","40"],2,"10²-8²=(10-8)(10+8)=2×18=36."]]},
{id:"ratio",type:"q",title:"النسبة والتناسب",idea:"النسبة تقارن بين كميتين، والتناسب يساوي بين نسبتين.",rule:"إذا كان مجموع الأشخاص معلومًا ونسبتهم a:b، فمجموع الأجزاء = a+b ثم قيمة الجزء = المجموع ÷ مجموع الأجزاء.",formula:"7 : 3 ، المجموع 60 → قيمة الجزء 60÷10=6",steps:["اجمع أجزاء النسبة.","اقسم المجموع على مجموع الأجزاء.","اضرب قيمة الجزء في عدد أجزاء المطلوب."],qs:[["نسبة الأولاد للبنات 3:2 وعدد الجميع25، الأولاد؟",["10","12","15","18"],2,"مجموع الأجزاء=5، قيمة الجزء=25÷5=5، الأولاد=3×5=15."],["نسبة رجال لنساء 7:3 وعددهم60، النساء؟",["18","21","30","42"],0,"مجموع الأجزاء10، قيمة الجزء6، النساء=3×6=18."],["8:12 بأبسط صورة؟",["2:3","3:2","4:5","1:2"],0,"نقسم الطرفين على4 → 2:3."]]},
{id:"percent",type:"q",title:"النسبة المئوية",idea:"النسبة المئوية جزء من 100.",rule:"x% من عدد = x/100 × العدد.",formula:"20% من 150 = 20/100 × 150 = 30",steps:["حوّل النسبة إلى كسر من100 أو عدد عشري.","اضربها في العدد.","في الزيادة أضف الناتج، وفي النقص اطرحه."],qs:[["25% من80؟",["10","20","25","40"],1,"25%=1/4، وربع80=20."],["10% من200؟",["10","20","30","40"],1,"10/100×200=20."],["50 من200 تساوي كم %؟",["20%","25%","40%","50%"],1,"50÷200=0.25=25%."]]},
{id:"profit",type:"q",title:"الربح والخسارة",idea:"الربح هو زيادة سعر البيع على الشراء، والخسارة هي نقصه.",rule:"الربح = سعر البيع - سعر الشراء. الخسارة = سعر الشراء - سعر البيع.",formula:"اشترى بـ100 وباع بـ120 → الربح=20",steps:["حدد سعر الشراء.","حدد سعر البيع.","اطرح الأصغر من الأكبر وحدد هل الناتج ربح أو خسارة."],qs:[["اشترى بـ100 وباع بـ130، الربح؟",["20","30","40","50"],1,"130-100=30."],["اشترى بـ200 وباع بـ170، الخسارة؟",["20","30","40","50"],1,"200-170=30."],["لا ربح ولا خسارة عندما؟",["البيع أكبر","الشراء أكبر","السعران متساويان","لا يوجد شراء"],2,"إذا تساوى سعر الشراء والبيع فالفارق صفر."]]},
{id:"motion",type:"q",title:"الحركة: المسافة والسرعة والزمن",idea:"تربط قوانين الحركة بين المسافة والسرعة والزمن.",rule:"السرعة = المسافة ÷ الزمن، المسافة = السرعة × الزمن، الزمن = المسافة ÷ السرعة.",formula:"المسافة = السرعة × الزمن",steps:["حدد المطلوب.","اختر القانون المناسب.","وحّد الوحدات ثم عوّض."],qs:[["سرعة60 كم/س لمدة2س، المسافة؟",["30","60","120","180"],2,"60×2=120 كم."],["مسافة150 كم بسرعة50، الزمن؟",["2","3","4","5"],1,"150÷50=3 ساعات."],["قطع100كم في2س، السرعة؟",["25","50","75","100"],1,"100÷2=50 كم/س."]]},
{id:"average",type:"q",title:"المتوسط الحسابي",idea:"المتوسط يوزع مجموع القيم بالتساوي على عددها.",rule:"المتوسط = مجموع القيم ÷ عددها.",formula:"10+20+30=60 → 60÷3=20",steps:["اجمع القيم.","احسب عدد القيم.","اقسم المجموع على العدد."],qs:[["متوسط4 أعداد=15، مجموعها؟",["45","50","60","75"],2,"15×4=60."],["متوسط10 و20 و30؟",["15","20","25","30"],1,"60÷3=20."],["مجموع5 أعداد100، المتوسط؟",["15","20","25","50"],1,"100÷5=20."]]},
{id:"prob",type:"q",title:"الاحتمالات والإحصاء",idea:"الاحتمال يقيس فرصة وقوع حدث.",rule:"الاحتمال = عدد النتائج المطلوبة ÷ عدد النتائج الممكنة.",formula:"قطعة نقد: احتمال الصورة = 1/2",steps:["عد النتائج الممكنة.","عد النتائج التي تحقق المطلوب.","اقسم المطلوب على الممكن."],qs:[["نرد: احتمال ظهور6؟",["1/2","1/3","1/6","1"],2,"هناك6 نتائج ممكنة ونتيجة واحدة مطلوبة."],["قطعة نقد: احتمال كتابة؟",["1/4","1/2","3/4","1"],1,"نتيجتان ممكنتان وواحدة مطلوبة."],["كيس فيه3 حمراء و2 زرقاء، احتمال حمراء؟",["2/5","3/5","1/2","3/2"],1,"3 من أصل5."]]},
{id:"angles",type:"q",title:"الزوايا والمضلعات والمستقيمات",idea:"قواعد الزوايا تختصر كثيرًا من أسئلة الهندسة.",rule:"الزاوية المستقيمة 180°، والدوران الكامل 360°، ومجموع زوايا المثلث 180°، ومجموع زوايا الشكل الرباعي 360°.",formula:"مثلث: أ + ب + ج = 180°",steps:["حدد نوع الشكل أو العلاقة.","اكتب مجموع الزوايا المناسب.","اطرح الزوايا المعلومة لإيجاد المجهول."],qs:[["مثلث زاويتاه60 و50، الثالثة؟",["60","70","80","90"],1,"180-60-50=70."],["مجموع زوايا الشكل الرباعي؟",["180","270","360","540"],2,"مجموعها360°."],["زاويتان على خط مستقيم إحداهما120، الأخرى؟",["30","50","60","70"],2,"180-120=60."]]},
{id:"triangle",type:"q",title:"المثلث",idea:"للمثلث قوانين للمساحة والمحيط وزواياه.",rule:"مساحة المثلث = 1/2 × القاعدة × الارتفاع، والمحيط = مجموع أطوال الأضلاع.",formula:"المساحة = ½ × القاعدة × الارتفاع",steps:["حدد القاعدة والارتفاع إذا كان المطلوب مساحة.","اضرب القاعدة في الارتفاع.","خذ نصف الناتج."],qs:[["قاعدة10 وارتفاع6، المساحة؟",["16","30","60","120"],1,"½×10×6=30."],["أضلاع3،4،5، المحيط؟",["7","9","12","15"],2,"3+4+5=12."],["مجموع زوايا المثلث؟",["90","180","270","360"],1,"مجموع زواياه180°."]]},
{id:"rect",type:"q",title:"المربع والمستطيل",idea:"المساحة تقيس الداخل والمحيط يقيس الحدود.",rule:"مساحة المستطيل = الطول×العرض، محيطه=2(الطول+العرض). مساحة المربع=الضلع²، محيطه=4×الضلع.",formula:"مستطيل 8×5 → المساحة40، المحيط26",steps:["حدد الشكل.","حدد هل المطلوب مساحة أم محيط.","اكتب القانون ثم عوّض."],qs:[["مساحة مستطيل8×5؟",["13","26","40","80"],2,"8×5=40."],["محيط مربع ضلعه6؟",["12","24","36","48"],1,"4×6=24."],["مساحة مربع ضلعه7؟",["14","28","42","49"],3,"7²=49."]]},
{id:"quad",type:"q",title:"المعين ومتوازي الأضلاع وشبه المنحرف",idea:"كل شكل له خصائص وقانون مساحة مناسب.",rule:"مساحة المعين = 1/2 حاصل ضرب القطرين. مساحة متوازي الأضلاع = القاعدة×الارتفاع.",formula:"معين قطره 12 و8 → المساحة = ½×12×8=48",steps:["حدد نوع الشكل.","استخرج الأبعاد المطلوبة للقانون.","عوّض ثم احسب."],qs:[["معين قطراه12 و8، المساحة؟",["24","48","72","96"],1,"½×12×8=48."],["متوازي أضلاع قاعدته9 وارتفاعه4، المساحة؟",["13","18","36","72"],2,"9×4=36."],["مجموع زوايا أي شكل رباعي؟",["180","270","360","540"],2,"360°."]]},
{id:"circle",type:"q",title:"الدائرة",idea:"نستخدم نصف القطر والقطر في حساب المحيط والمساحة.",rule:"القطر=2×نصف القطر، المحيط=2πr، المساحة=πr².",formula:"إذا r=3 → القطر=6",steps:["حدد نصف القطر أو القطر.","حوّل بينهما إذا احتجت.","اختر قانون المحيط أو المساحة."],qs:[["نصف القطر5، القطر؟",["5","10","15","25"],1,"القطر=2×5=10."],["القطر12، نصف القطر؟",["3","6","12","24"],1,"12÷2=6."],["قانون مساحة الدائرة؟",["2πr","πr²","πd","r²"],1,"المساحة=πr²."]]},
{id:"solids",type:"q",title:"المجسمات والحجوم",idea:"الحجم يقيس الحيز داخل المجسم.",rule:"حجم متوازي المستطيلات = الطول×العرض×الارتفاع، وحجم المكعب = الضلع³.",formula:"مكعب ضلعه3 → الحجم=27",steps:["حدد المجسم.","حدد الأبعاد.","طبّق قانون الحجم."],qs:[["مكعب ضلعه4، الحجم؟",["12","16","32","64"],3,"4³=64."],["متوازي مستطيلات2×3×5، الحجم؟",["10","20","30","60"],2,"2×3×5=30."],["مكعب حجمه125، ضلعه؟",["4","5","10","25"],1,"5³=125."]]},

function esc(s){return String(s??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}
function login(){app.innerHTML=`<div class="card login"><h1>تسجيل الدخول</h1><p class="muted">ادخل بريدك والرمز الخاص بحسابك.</p><input id="em" placeholder="البريد الإلكتروني"><input id="cd" placeholder="الرمز الخاص"><button class="btn primary" id="go">دخول</button><p class="muted">الدعم: <b>0590308550</b></p></div>`;$('go').onclick=()=>{const u=db.users.find(x=>x.email===$('em').value.trim()&&x.code===$('cd').value.trim()&&x.active);if(!u)return alert('بيانات الدخول غير صحيحة');db.user=u;save();home()}}
function roleName(r){return r==='owner'?'مالك':r==='supervisor'?'مشرف':'طالب'}
function home(){if(!db.user)return login();const u=db.user;let admin='';if(u.role==='owner')admin=`<div class="grid"><button class="choice f" id="manage">👑 إدارة الحسابات والصلاحيات</button><button class="choice t" id="ownerProgress">📊 متابعة الطلاب</button></div>`;else if(u.role==='supervisor'&&u.permissions?.progress)admin=`<button class="choice t" id="ownerProgress">📊 متابعة الطلاب</button>`;app.innerHTML=`<div class="card"><h2>هلا ${esc(u.name)}</h2><span class="pill">${roleName(u.role)}</span></div>${admin}<div class="grid"><button class="choice f" id="q">🔢 التأسيس الكمي<br><span class="lessonCount">${lessons.filter(x=>x.type==='q').length} قاعدة</span></button><button class="choice f" id="v">📝 التأسيس اللفظي<br><span class="lessonCount">${lessons.filter(x=>x.type==='v').length} مهارات</span></button></div><div class="grid"><button class="choice t" id="myProgress">📈 مستواي</button><button class="choice t" id="plan">🗓️ خطتي</button></div><div class="grid"><button class="card" id="support">🛟 الدعم الفني</button><button class="card" id="notebook">📓 دفتري</button></div><button class="btn secondary" id="logout">خروج</button>`;$('q').onclick=()=>section('q');$('v').onclick=()=>section('v');$('myProgress').onclick=myProgress;$('plan').onclick=plan;$('support').onclick=support;$('notebook').onclick=notebook;$('logout').onclick=()=>{db.user=null;save();login()};if($('manage'))$('manage').onclick=manage;if($('ownerProgress'))$('ownerProgress').onclick=ownerProgress}
function section(t){const arr=lessons.filter(x=>x.type===t);app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>${t==='q'?'التأسيس الكمي':'التأسيس اللفظي'}</h2><p class="muted">ابدأ بالشرح ثم حل أسئلة الدرس. إذا أخطأت تظهر لك طريقة الحل مباشرة.</p></div>${arr.map((l,i)=>`<div class="row"><div><b>${i+1}. ${l.title}</b><br><span class="muted">نتيجتك: ${db.progress[db.user.id+'_'+l.id]??'لم تختبر'}${db.progress[db.user.id+'_'+l.id]!=null?'%':''}</span></div><button class="btn primary openLesson" data-id="${l.id}">ابدأ</button></div>`).join('')}`;$('back').onclick=home;app.querySelectorAll('.openLesson').forEach(b=>b.onclick=()=>lesson(b.dataset.id))}
function renderMath(l){if(l.board)return `<div class="mathBoard">${esc(l.board)}</div>`;if(l.formula)return `<div class="formula">${esc(l.formula)}</div>`;return ''}
function lesson(id){const l=lessons.find(x=>x.id===id),noteKey=db.user.id+'_'+id;app.innerHTML=`<button class="btn secondary" id="back">رجوع</button><div class="card"><h2>${l.title}</h2><div class="read why"><b>القاعدة:</b><br>${l.idea}</div><div class="read how"><b>القانون / الفكرة الأساسية:</b><br>${l.rule}</div>${renderMath(l)}<div class="read remember"><b>طريقة الحل:</b><ol>${l.steps.map(s=>`<li>${s}</li>`).join('')}</ol></div></div><div class="card"><h3>تدريب بعد الشرح</h3><div id="quiz">${l.qs.map((q,i)=>`<div class="qbox" data-q="${i}" style="margin:20px 0"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="option" data-q="${i}" data-o="${j}">${o}</button>`).join('')}<div class="feedback" id="fb${i}"></div></div>`).join('')}</div><button class="btn primary" id="finish">حفظ النتيجة</button><div id="result"></div></div><div class="noteDock"><b>📓 دفتر الحصة</b><textarea id="lessonNote" rows="4" placeholder="اكتب حلك وحساباتك هنا...">${esc(db.notes[noteKey]||'')}</textarea><div class="keypad" id="keypad">${['+','−','×','÷','=','√','%','²','³','(',')','/'].map(k=>`<button type="button">${k}</button>`).join('')}</div><span class="muted tiny">يحفظ تلقائيًا مع هذه الحصة</span></div>`;$('back').onclick=()=>section(l.type);$('lessonNote').oninput=()=>{db.notes[noteKey]=$('lessonNote').value;save()};$('keypad').querySelectorAll('button').forEach(k=>k.onclick=()=>{const ta=$('lessonNote'),s=ta.selectionStart,e=ta.selectionEnd;ta.value=ta.value.slice(0,s)+k.textContent+ta.value.slice(e);ta.selectionStart=ta.selectionEnd=s+k.textContent.length;ta.focus();db.notes[noteKey]=ta.value;save()});
app.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const qi=+b.dataset.q,oi=+b.dataset.o,q=l.qs[qi],box=app.querySelector(`.qbox[data-q="${qi}"]`),fb=$('fb'+qi);box.querySelectorAll('.option').forEach(x=>x.classList.remove('sel','correct','wrong'));b.classList.add('sel');if(oi===q[2]){b.classList.add('correct');fb.innerHTML=`<div class="read remember"><b>صحيح ✓</b><br>${typeof q[3]==='string'&&q[3].includes('\n')?`<div class="mathBoard">${esc(q[3])}</div>`:esc(q[3])}</div>`}else{b.classList.add('wrong');fb.innerHTML=`<div class="read mistake"><b>إجابتك غير صحيحة.</b><br><b>طريقة الحل:</b>${typeof q[3]==='string'&&q[3].includes('\n')?`<div class="mathBoard">${esc(q[3])}</div>`:`<p>${esc(q[3])}</p>`}</div>`}});
$('finish').onclick=()=>{let answered=0,score=0;l.qs.forEach((q,i)=>{const x=app.querySelector(`.sel[data-q="${i}"]`);if(x){answered++;if(+x.dataset.o===q[2])score++}});if(answered<l.qs.length)return alert('جاوب كل الأسئلة أول');const pct=Math.round(score/l.qs.length*100);db.progress[db.user.id+'_'+l.id]=pct;save();$('result').innerHTML=`<div class="card"><h3>نتيجتك ${pct}%</h3><p>${pct>=80?'ممتاز، تقدر تنتقل للدرس التالي.':'راجع القاعدة وحاول مرة ثانية حتى تثبت المهارة.'}</p></div>`}}
function myProgress(){const u=db.user,vals=lessons.map(l=>db.progress[u.id+'_'+l.id]).filter(v=>v!=null),avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0,done=vals.length;const weak=lessons.filter(l=>(db.progress[u.id+'_'+l.id]??100)<70);app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>📈 مستواي</h2><div class="grid3"><div class="card"><div class="stat">${avg}%</div><span class="muted">متوسط الأداء</span></div><div class="card"><div class="stat">${done}/${lessons.length}</div><span class="muted">دروس تم اختبارها</span></div><div class="card"><div class="stat">${weak.length}</div><span class="muted">مهارات تحتاج مراجعة</span></div></div><div class="progress"><i style="width:${Math.round(done/lessons.length*100)}%"></i></div></div>${weak.length?`<div class="card mistake"><b>تحتاج تراجع:</b> ${weak.map(x=>x.title).join('، ')}</div>`:''}${lessons.map(l=>`<div class="row"><b>${l.title}</b><span>${db.progress[u.id+'_'+l.id]??'—'}${db.progress[u.id+'_'+l.id]!=null?'%':''}</span></div>`).join('')}`;$('back').onclick=home}
function ownerProgress(){if(!db.user||!(db.user.role==='owner'||(db.user.role==='supervisor'&&db.user.permissions?.progress)))return home();const students=db.users.filter(u=>u.role==='student');app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>📊 متابعة الطلاب</h2><p class="muted">متوسط الطالب، عدد الدروس المنجزة، والمهارات الضعيفة.</p></div>${students.map(s=>{const vals=lessons.map(l=>db.progress[s.id+'_'+l.id]).filter(v=>v!=null),avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0,weak=lessons.filter(l=>(db.progress[s.id+'_'+l.id]??100)<70).length;return `<div class="row"><div><b>${esc(s.name)}</b><br><span class="muted">${esc(s.email)} • منجز ${vals.length}/${lessons.length} • ضعيف ${weak}</span></div><div><b>${avg}%</b><br><button class="btn secondary studentDetail" data-id="${s.id}">التفاصيل</button></div></div>`}).join('')||'<div class="card">لا يوجد طلاب بعد.</div>'}`;$('back').onclick=home;app.querySelectorAll('.studentDetail').forEach(b=>b.onclick=()=>studentDetail(b.dataset.id))}
function studentDetail(id){const s=db.users.find(x=>x.id===id);app.innerHTML=`<button class="btn secondary" id="back">رجوع</button><div class="card"><h2>${esc(s.name)}</h2><span class="pill">متابعة مستوى الطالب</span></div>${lessons.map(l=>`<div class="row"><b>${l.title}</b><span>${db.progress[id+'_'+l.id]??'لم يختبر'}${db.progress[id+'_'+l.id]!=null?'%':''}</span></div>`).join('')}`;$('back').onclick=ownerProgress}
function manage(){if(db.user.role!=='owner')return home();app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>👑 إدارة الحسابات والصلاحيات</h2><p class="muted">تعديل البيانات وإدارة الحسابات متاحة للمالك فقط.</p><input id="n" placeholder="الاسم"><input id="e" placeholder="البريد"><select id="r"><option value="student">طالب</option><option value="supervisor">مشرف</option></select><select id="a"><option value="all">كمي + لفظي</option><option value="q">كمي</option><option value="v">لفظي</option></select><label><input id="pProgress" type="checkbox" style="width:auto"> للمشرف: متابعة الطلاب</label><br><label><input id="pSupport" type="checkbox" style="width:auto"> للمشرف: استقبال والرد على الدعم</label><br><button class="btn primary" id="create">إنشاء الحساب</button></div>${db.users.filter(x=>x.id!=='owner').map(u=>`<div class="row"><div><b>${esc(u.name)}</b> <span class="pill">${roleName(u.role)}</span><br><span class="muted">${esc(u.email)} • ${esc(u.code)}</span></div><button class="btn ${u.active?'danger':'primary'} toggle" data-id="${u.id}">${u.active?'إيقاف':'تفعيل'}</button></div>`).join('')}`;$('back').onclick=home;$('create').onclick=()=>{if(!$('n').value.trim()||!$('e').value.trim())return alert('كمل الاسم والبريد');const role=$('r').value,code=(role==='supervisor'?'SUP-':'STU-')+Math.random().toString(36).slice(2,8).toUpperCase();db.users.push({id:String(Date.now()),name:$('n').value.trim(),email:$('e').value.trim(),role,access:$('a').value,code,active:true,permissions:{progress:$('pProgress').checked,support:$('pSupport').checked}});save();alert('الرمز الخاص: '+code);manage()};app.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>{const u=db.users.find(x=>x.id===b.dataset.id);u.active=!u.active;save();manage()})}
function support(){const u=db.user,staff=u.role==='owner'||(u.role==='supervisor'&&u.permissions?.support);if(staff){app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>🛟 صندوق الدعم</h2><p class="muted">الطلاب يرسلون التذاكر، وأنت أو المشرف المصرح له يرد ويغلق التذكرة.</p></div>${db.tickets.map((t,i)=>`<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(t.title)}</b><span class="${t.status==='closed'?'statusClosed':'statusOpen'}">${t.status==='closed'?'مغلقة':'مفتوحة'}</span></div><p>${esc(t.body)}</p><span class="muted">من: ${esc(t.fromName)}</span><textarea id="reply${i}" placeholder="اكتب الرد">${esc(t.reply||'')}</textarea><button class="btn primary reply" data-i="${i}">حفظ الرد</button> <button class="btn secondary closeT" data-i="${i}">${t.status==='closed'?'إعادة فتح':'إغلاق التذكرة'}</button></div>`).join('')||'<div class="card">لا توجد تذاكر.</div>'}`;$('back').onclick=home;app.querySelectorAll('.reply').forEach(b=>b.onclick=()=>{db.tickets[+b.dataset.i].reply=$('reply'+b.dataset.i).value;save();alert('تم حفظ الرد')});app.querySelectorAll('.closeT').forEach(b=>b.onclick=()=>{let t=db.tickets[+b.dataset.i];t.status=t.status==='closed'?'open':'closed';save();support()});return}app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>🛟 الدعم الفني</h2><input id="tt" placeholder="عنوان المشكلة"><textarea id="tb" rows="5" placeholder="اكتب المشكلة"></textarea><button class="btn primary" id="send">إرسال التذكرة</button><p class="muted">رقم الدعم: 0590308550</p></div>${db.tickets.filter(t=>t.from===u.id).map(t=>`<div class="card"><div class="row" style="border:0;padding:0"><b>${esc(t.title)}</b><span class="${t.status==='closed'?'statusClosed':'statusOpen'}">${t.status==='closed'?'مغلقة':'مفتوحة'}</span></div><p>${esc(t.body)}</p>${t.reply?`<div class="read remember"><b>رد الدعم:</b><br>${esc(t.reply)}</div>`:'<span class="muted">بانتظار الرد</span>'}</div>`).join('')}`;$('back').onclick=home;$('send').onclick=()=>{if(!$('tt').value.trim()||!$('tb').value.trim())return alert('اكتب العنوان والمشكلة');db.tickets.push({from:u.id,fromName:u.name,title:$('tt').value.trim(),body:$('tb').value.trim(),reply:'',status:'open'});save();support()}}
function notebook(){const u=db.user,items=lessons.filter(l=>db.notes[u.id+'_'+l.id]);app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>📓 دفتري</h2><p class="muted">هنا كل ما كتبته داخل الحصص.</p></div>${items.map(l=>`<div class="card"><b>${l.title}</b><p style="white-space:pre-wrap">${esc(db.notes[u.id+'_'+l.id]||'')}</p></div>`).join('')||'<div class="card">ما كتبت ملاحظات إلى الآن.</div>'}`;$('back').onclick=home}
function plan(){const d=db.plan.days||90;app.innerHTML=`<button class="btn secondary" id="back">الرئيسية</button><div class="card"><h2>🗓️ خطتي</h2><input id="days" type="number" min="7" max="365" value="${d}"><button class="btn primary" id="savePlan">تحديث المدة</button><p class="muted">الاشتراك سنة، وتقدر تغيّر مدة خطتك ويظل تقدمك محفوظًا.</p></div>${Array.from({length:d},(_,i)=>`<div class="row"><b>اليوم ${i+1}</b><span class="pill">${i<Math.round(d*.35)?'تأسيس':i<Math.round(d*.8)?'تدريب':'محاكاة'}</span></div>`).join('')}`;$('back').onclick=home;$('savePlan').onclick=()=>{db.plan.days=Math.max(7,Math.min(365,+$('days').value||90));save();plan()}}
home();
})();
</script>
